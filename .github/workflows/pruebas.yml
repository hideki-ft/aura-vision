name: pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Bibliotecas del sistema para OpenCV (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Tests (sin cámara ni modelos)
        run: python -m pytest -q
      - name: La app arranca (modo sintético, 8 s)
        run: python app.py --sintetico --no-navegador --segundos 8
